<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro</title>

  <link rel="stylesheet" href="cadastro.css">

  <!--
    Carrega o JavaScript como módulo.
    Isso será necessário para importar os serviços
    do Firebase Authentication e Firestore.
  -->
  <script type="module" src="script.js"></script>
</head>

<body>

  <!--
    DIV PRINCIPAL QUE CONTROLA AS DUAS ÁREAS DA TELA
  -->
  <div class="container">

    <!-- LADO ESQUERDO -->
    <div class="left">

      <h1>Crie sua conta</h1>

      <p>
        Cadastre-se para acessar nossa plataforma
        e aproveitar todos os recursos disponíveis.
      </p>

    </div>


    <!-- LADO DIREITO -->
    <div class="right">

      <h2>Cadastro</h2>


      <!--
        Formulário de cadastro.

        O JavaScript localizará este formulário
        através do id="formulario".
      -->
      <form action="#" id="formulario">

        <!-- NOME E SOBRENOME -->
        <div class="row">

          <div class="form-group">

            <input
              type="text"
              id="nome"
              placeholder="Nome"
              required
            >

          </div>


          <div class="form-group">

            <input
              type="text"
              id="sobrenome"
              placeholder="Sobrenome"
              required
            >

          </div>

        </div>


        <!-- E-MAIL -->
        <div class="form-group">

          <input
            type="email"
            id="email"
            placeholder="Email"
            required
          >

        </div>


        <!-- NOME DE USUÁRIO -->
        <div class="form-group">

          <input
            type="text"
            id="usuario"
            placeholder="Usuário"
            required
          >

        </div>


        <!-- SENHA E CONFIRMAÇÃO -->
        <div class="row">

          <div class="form-group">

            <input
              type="password"
              id="senha"
              placeholder="Senha"
              required
            >

          </div>


          <div class="form-group">

            <input
              type="password"
              id="confirmarSenha"
              placeholder="Confirmar senha"
              required
            >

          </div>

        </div>


        <!--
          Botão responsável por enviar o formulário.
        -->
        <button
          type="submit"
          class="btn"
          id="submit"
        >
          Criar conta
        </button>

      </form>


      <!--
        Área onde o JavaScript poderá apresentar
        mensagens de sucesso ou erro.
      -->
      <p id="mensagem"></p>


      <div class="links">

        <a href="form.html">
          Já tenho uma conta
        </a>

      </div>

    </div>

  </div>

</body>

</html>
